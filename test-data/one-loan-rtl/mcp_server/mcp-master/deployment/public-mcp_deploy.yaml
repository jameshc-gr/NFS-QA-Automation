AWSTemplateFormatVersion: '2010-09-09'
Description: 'MCP Server Public Deployment - Public-facing MCP server with token authentication'

Parameters:
  Region:
    Type: String
    Default: us-east-2
    Description: AWS region for deployment
  
  AccountId:
    Type: String
    Default: 730784326723
    Description: AWS Account ID
  
  Domain:
    Type: String
    Default: mcp.prajnagpt.net
    Description: Domain name for the MCP server
  
  VpcId:
    Type: String
    Description: Existing VPC ID for deployment
  
  KeyName:
    Type: String
    Default: gpt-aws-key-2
    Description: EC2 Key Pair name
  
  UbuntuAMI:
    Type: String
    Default: ami-0e83be366243f524a
    Description: Ubuntu AMI ID
  
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type
  
  MCPVersion:
    Type: String
    Default: latest
    Description: MCP Server version/tag to deploy
  
  LogLevel:
    Type: String
    Default: INFO
    Description: Log level for the application
  
  HostedZoneName:
    Type: String
    Default: prajnagpt.net.
    Description: Route53 hosted zone name ending with a dot (e.g., example.com.)
  
  MCPAuthToken:
    Type: String
    Default: demo-token-123567890-1234567890-1234567890
    Description: Authentication token for MCP server (minimum 32 characters required)
    MinLength: 32
    NoEcho: true
  
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM Certificate ARN for HTTPS (leave empty for HTTP only)
  
  MinSize:
    Type: Number
    Default: 1
    Description: Minimum number of instances
  
  MaxSize:
    Type: Number
    Default: 3
    Description: Maximum number of instances
  
  DesiredCapacity:
    Type: Number
    Default: 1
    Description: Desired number of instances

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  # Public Subnet 1 (us-east-2a)
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 172.31.200.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: mcp-public-subnet-1
        - Key: Environment
          Value: Production
        - Key: Type
          Value: Public

  # Public Subnet 2 (us-east-2b)
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 172.31.201.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: mcp-public-subnet-2
        - Key: Environment
          Value: Production
        - Key: Type
          Value: Public

  # Public Subnet 3 (us-east-2c)
  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: !Select [2, !GetAZs '']
      CidrBlock: 172.31.202.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: mcp-public-subnet-3
        - Key: Environment
          Value: Production
        - Key: Type
          Value: Public

  # Route Table for Public Subnets
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: mcp-public-rt
        - Key: Environment
          Value: Production

  # Default route for public subnets
  DefaultPublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: igw-0fae59e56fae0408f

  # Associate Public Subnets with Route Table
  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet3

  # Security Group for Public ALB
  PublicALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: mcp-public-alb-sg
      GroupDescription: Security group for MCP Public ALB - Internet access
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from Internet
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from Internet
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
      Tags:
        - Key: Name
          Value: mcp-public-alb-sg
        - Key: Environment
          Value: Production

  # Security Group for EC2 instances
  MCPInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: mcp-instance-sg
      GroupDescription: Security group for MCP server instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref PublicALBSecurityGroup
          Description: MCP server from ALB
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
      Tags:
        - Key: Name
          Value: mcp-instance-sg
        - Key: Environment
          Value: Production

  # Public Application Load Balancer
  PublicALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: mcp-public-alb
      Scheme: internal
      Type: application
      Subnets: 
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      SecurityGroups:
        - !Ref PublicALBSecurityGroup
      Tags:
        - Key: Name
          Value: mcp-public-alb
        - Key: Environment
          Value: Production

  # Target Group for MCP Server
  MCPTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: mcp-target-group
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetType: instance
      Tags:
        - Key: Name
          Value: mcp-target-group
        - Key: Environment
          Value: Production

  # ALB Listener (HTTP) - Redirect to HTTPS if certificate provided, otherwise forward
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: 443
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref MCPTargetGroup
      LoadBalancerArn: !Ref PublicALB
      Port: 80
      Protocol: HTTP

  # ALB Listener (HTTPS) - Only if certificate provided
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref MCPTargetGroup
      LoadBalancerArn: !Ref PublicALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS-1-2-2017-01

  # IAM Role for EC2 instances
  MCPInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mcp-instance-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: MCPInstancePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: '*'
              - Effect: Allow
                Action:
                  - elbv2:DescribeTargetGroups
                Resource: !Ref MCPTargetGroup
      Tags:
        - Key: Name
          Value: mcp-instance-role
        - Key: Environment
          Value: Production

  # Instance Profile for EC2 instances
  MCPInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref MCPInstanceRole

  # Launch Template for EC2 instances
  MCPLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: mcp-launch-template
      LaunchTemplateData:
        ImageId: !Ref UbuntuAMI
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        SecurityGroupIds:
          - !Ref MCPInstanceSecurityGroup
        IamInstanceProfile:
          Name: !Ref MCPInstanceProfile
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: mcp-instance
              - Key: Environment
                Value: Production
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Update system and install dependencies
            apt-get update -y
            apt-get install -y docker.io git awscli jq
            
            # Start and enable Docker
            systemctl start docker
            systemctl enable docker
            usermod -a -G docker ubuntu
            
            # Authenticate to ECR (using older method that works reliably)
            $(aws ecr get-login --no-include-email --region ${Region})
            
            # Pull and run MCP server
            # Stop and remove old container if it exists (for updates)
            docker stop mcp-server || true
            docker rm mcp-server || true
            
            # Force pull latest image (no cache to ensure we get the newest version)
            docker pull ${AccountId}.dkr.ecr.${Region}.amazonaws.com/mcp-server:${MCPVersion}
            
            # Run new container
            docker run -d \
              --name mcp-server \
              --restart unless-stopped \
              -p 8080:8080 \
              -e MCP_HOST=0.0.0.0 \
              -e MCP_PORT=8080 \
              -e MCP_AUTH_ENABLED=true \
              -e MCP_AUTH_TOKEN=${MCPAuthToken} \
              -e MCP_PUBLIC_ACCESS=true \
              -e LOG_LEVEL=${LogLevel} \
              ${AccountId}.dkr.ecr.${Region}.amazonaws.com/mcp-server:${MCPVersion}
            
            # Register with ALB target group
            INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
            aws elbv2 register-targets \
              --target-group-arn ${MCPTargetGroup} \
              --targets Id=$INSTANCE_ID,Port=8080 \
              --region ${Region}

  # Auto Scaling Group
  MCPAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: mcp-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref MCPLaunchTemplate
        Version: !GetAtt MCPLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier: 
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      TargetGroupARNs:
        - !Ref MCPTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: mcp-instance
          PropagateAtLaunch: true
        - Key: Environment
          Value: Production
          PropagateAtLaunch: true

  # Auto Scaling Policies
  ScaleUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AdjustmentType: ChangeInCapacity
      AutoScalingGroupName: !Ref MCPAutoScalingGroup
      Cooldown: 300
      ScalingAdjustment: 1

  ScaleDownPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AdjustmentType: ChangeInCapacity
      AutoScalingGroupName: !Ref MCPAutoScalingGroup
      Cooldown: 300
      ScalingAdjustment: -1

  # CloudWatch Alarms
  CPUAlarmHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alarm when CPU exceeds 70%
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref MCPAutoScalingGroup
      AlarmActions:
        - !Ref ScaleUpPolicy

  CPUAlarmLow:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alarm when CPU drops below 20%
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 20
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref MCPAutoScalingGroup
      AlarmActions:
        - !Ref ScaleDownPolicy

  # Route 53 DNS Record
  MCPDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref HostedZoneName
      Name: mcp.prajnagpt.net
      Type: A
      AliasTarget:
        DNSName: !GetAtt PublicALB.DNSName
        HostedZoneId: !GetAtt PublicALB.CanonicalHostedZoneID

Outputs:
  VPCId:
    Description: VPC ID where MCP server is deployed
    Value: !Ref VpcId
    Export:
      Name: !Sub ${AWS::StackName}-VPCId
  
  PublicSubnetIds:
    Description: Public subnet IDs for ALB
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3]]
    Export:
      Name: !Sub ${AWS::StackName}-PublicSubnetIds
  
  ALBDNSName:
    Description: DNS name of the public ALB
    Value: !GetAtt PublicALB.DNSName
    Export:
      Name: !Sub ${AWS::StackName}-ALBDNSName
  
  ALBSecurityGroupId:
    Description: Security Group ID for Public ALB
    Value: !Ref PublicALBSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-ALBSecurityGroupId
  
  InstanceSecurityGroupId:
    Description: Security Group ID for EC2 instances
    Value: !Ref MCPInstanceSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-InstanceSecurityGroupId
  
  MCPDomain:
    Description: MCP server domain name
    Value: !Ref Domain
    Export:
      Name: !Sub ${AWS::StackName}-MCPDomain
  
  AutoScalingGroupName:
    Description: Auto Scaling Group name
    Value: !Ref MCPAutoScalingGroup
    Export:
      Name: !Sub ${AWS::StackName}-AutoScalingGroupName
  
  PublicURL:
    Description: Public URL for MCP server
    Value: !Sub "http://${PublicALB.DNSName}"
    Export:
      Name: !Sub ${AWS::StackName}-PublicURL
