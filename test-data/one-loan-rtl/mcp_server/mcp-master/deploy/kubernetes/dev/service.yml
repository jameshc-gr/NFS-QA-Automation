apiVersion: v1
kind: Service
metadata:
  labels:
    task: webserver
  name: digital-mortgage-systems-mcp-dev
  namespace: digital-mortgage-systems-mcp
  annotations: {}
spec:
  type: ClusterIP
  ports:
    - port: 80
      name: http
      targetPort: 8080
  selector:
    app: digital-mortgage-systems-mcp-dev
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digital-mortgage-systems-mcp-dev
  namespace: digital-mortgage-systems-mcp
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: digital-mortgage-systems-mcp-dev
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: 200-299
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-2017-01
    alb.ingress.kubernetes.io/tags: "Name=digital-mortgage-systems-mcp,Product=digital-mortgage-systems-mcp,ManagedBy=manual,TechOwner=NFS-AI-ML@rate.com,TechContact=NFS-AI-ML@rate.com,CodeRepo=https://github.com/Guaranteed-Rate/mcp,Compliance=none,Criticality=high,PublicFacing=no"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:336015931235:certificate/7eb90219-f793-4895-a7e0-1163f0eb424b
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  tls:
    - hosts:
        - digital-mortgage-systems-mcp-dev.dev.saas.rate.com
  rules:
    - http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
          - pathType: Prefix
            path: /
            backend:
              service:
                name: digital-mortgage-systems-mcp-dev
                port:
                  number: 80
