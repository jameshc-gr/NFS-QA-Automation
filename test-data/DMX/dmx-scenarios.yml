# ==============================================================================
# DMX loan scenarios (data source for tests/projects/DMX/*.spec.ts)
#
# Borrower names/SSNs/credit tiers come ONLY from the Fannie Mae DO/DU
# "Test Credit Report Characteristics" (9.9.26) in this folder. The PDF does not
# provide birthdates, phone numbers, addresses, employers or income, so those
# fields are synthetic and chosen to give the DTI / LTV profile named in each id.
# Property addresses are realistic for the market but are NOT verified against
# Zillow listings; treat them as fixtures.
# Every account is registered as my-dmx-<tag><n>--ra@yopmail.com / Test123!
# ==============================================================================

defaults:
  phone: "(312) 658-4000"          # 555 numbers are rejected by the app's phone validation
  employer_phone: "(312) 658-4100"
  password: "Test123!"

