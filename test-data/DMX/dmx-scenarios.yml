# ==============================================================================
# Incomplete applications for resume tests: stop_at is the DMX route where the
# user abandons the application; the test then re-enters and finishes it.
# ==============================================================================
incomplete:
  - { id: INC-01-abandon-after-personal-info,  base: PUR-01-single-good-credit-low-dti, stop_at: user-residence-ef,               note: "left after marital status / before address" }
  - { id: INC-02-abandon-before-credit-check,  base: PUR-06-single-small-loan-first-time, stop_at: credit-check-consent-borrower-ef, note: "left on the soft credit check consent" }
  - { id: INC-03-abandon-during-income,        base: PUR-03-single-high-dti,            stop_at: add-income-information,           note: "left on employment entry" }
  - { id: INC-04-abandon-refi-mid-flow,        base: REF-01-single-rate-term,           stop_at: interest-rate-refi2,              note: "refinance left after property details" }
  - { id: INC-05-abandon-before-government,    base: PUR-07-coborrower-excellent-credit, stop_at: government-questions-hmda,       note: "co-borrower loan left before government questions" }
