# iOS lane configuration.
#
# Encrypt any sensitive value with:
#   npx ts-node scripts/encrypt-config.ts encrypt "your-secret"
# Values written as ENC(...) are decrypted automatically when the YAML loads.
# Never commit a plaintext credential here.
#
# Anything left blank falls back to test-data/mobile-app/gri/android/config.yml.

# Active environment. Override at runtime with MOBILE_ENV=dev|prod
environment: dev

verification:
  email: yopmail        # manual | yopmail | outlook
  phone: google-voice   # manual | google-voice
  phoneNumber: 616-320-0701
  provider: google-voice

# Where the app's verification email actually lands, per environment.
#   dev  -> every verification email is redirected to the shared Outlook inbox,
#           so the message is found by the generated account address in the subject.
#   prod -> email is delivered normally, so the generated account's own Yopmail
#           mailbox is read (leave mailbox/address empty to use it automatically).
verificationInbox:
  dev:
    provider: outlook
    address: v3test@rate.com
    mailbox: v3test@rate.com
    matchSubjectByAccountEmail: true
  prod:
    provider: yopmail
    address: ""
    mailbox: ""
    matchSubjectByAccountEmail: false

googleVoice:
  email: "ENC(e848550282e3578ebc6e35ac:e9d529605ad73ecf6960554c7bae1ec5:3a6ba226ff236ec62a37b441da8060534e3a2356b9379f39)" # or "ENC(...)"
  password: "ENC(a018633d967870fae89031b5:bb282f4556da95aeb7481ac744957fd9:af5f61e1174af70b08)" # or "ENC(...)"

outlook:
  email: "ENC(e0fa8e986a435c83731a805e:9679c45f9bc609b5ea25b78fd47bbef4:b49b27f0ae96fd66d46e7062d47686a266d6ca8f9a1f8dccdee2)" # or "ENC(...)"
  password: "ENC(7cd70a149c833069e46fb4dd:5ebf0665d0c377b267b3f06f28be1499:cd12d9fcc1920a1c87653f63f269)" # or "ENC(...)"
  tenantId: "common"
  # Okta sign-in id (the AD user id, not the mailbox address).
  oktaUsername: "jameshc"
  clientId: "" # or "ENC(...)"
  clientSecret: "" # or "ENC(...)"

# TestFlight only runs on a real device; the iOS Simulator cannot install the
# TestFlight app or App Store builds. These credentials are only needed if you
# sign into TestFlight by hand on the device.
testflight:
  appleId: "" # or "ENC(...)"
  applePassword: "" # or "ENC(...)"
  deviceUdid: ""

# iOS build selection. Choose one with MOBILE_IOS_BUILD=<name>, or change
# defaultBuild. Each build declares how the app reaches the target:
#   source: simulator  -> installs a local .app bundle on the iOS Simulator
#   source: ipa        -> installs a signed .ipa on a connected real device
#   source: testflight -> launches a build already installed from TestFlight
# Only "simulator" works on the Simulator; ipa and testflight need a real device
# UDID (deviceUdid here, or MOBILE_IOS_DEVICE_UDID).
# An ipa build may point at a local ipaPath or an ipaUrl that is downloaded into
# mobile/.builds on first use. Encrypt ipaAuthHeader if the URL needs a token.
ios:
  defaultBuild: qa-simulator
  builds:
    qa-simulator:
      source: simulator
      bundleId: com.guaranteedrate.superapp.qa
      appPath: test-data/mobile-app/gri/ios/GRI QA.app
      deviceName: iPhone 17
    qa-ipa:
      source: ipa
      bundleId: com.guaranteedrate.superapp.qa
      ipaPath: ""
      ipaUrl: ""
      ipaAuthHeader: "" # e.g. "Authorization: Bearer ..." or "ENC(...)"
      deviceUdid: ""
    stage-ipa:
      source: ipa
      bundleId: com.guaranteedrate.superapp.stage
      ipaPath: ""
      ipaUrl: ""
      ipaAuthHeader: "" # or "ENC(...)"
      deviceUdid: ""
    qa-testflight:
      source: testflight
      bundleId: com.guaranteedrate.superapp.qa
      deviceUdid: ""
    stage-testflight:
      source: testflight
      bundleId: com.guaranteedrate.superapp.stage
      deviceUdid: ""
